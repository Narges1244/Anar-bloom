<style>
/* Layout: sticky app bar with page tabs; each calculator = editing panels left, sticky price card right; stacks on phones */
:root{
  --bg:#F8F4F6; --surface:#FFFFFF; --ink:#2A1A20; --muted:#7A6670; --line:#E7DCE1;
  --garnet:#9E1B3B; --garnet-soft:#F6E3E8; --pistachio:#5E8443; --pist-soft:#E8F0E1; --amber:#C98A2E;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1316; --surface:#241A1E; --ink:#F3E9ED; --muted:#B39CA6; --line:#3A2C32;
  --garnet:#F0607F; --garnet-soft:#3A1C25; --pistachio:#A3C985; --pist-soft:#24301C; --amber:#E0A85A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1316; --surface:#241A1E; --ink:#F3E9ED; --muted:#B39CA6; --line:#3A2C32;
  --garnet:#F0607F; --garnet-soft:#3A1C25; --pistachio:#A3C985; --pist-soft:#24301C; --amber:#E0A85A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1180px;margin:0 auto}

/* App bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .inner{display:flex;align-items:center;gap:18px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink);text-decoration:none;white-space:nowrap}
.seed{width:22px;height:22px;border-radius:50% 50% 50% 50%/55% 55% 45% 45%;background:var(--garnet);position:relative;flex:none}
.seed::after{content:"";position:absolute;left:7px;top:-4px;width:8px;height:6px;background:var(--garnet);clip-path:polygon(0 100%,20% 0,50% 60%,80% 0,100% 100%)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:500;padding:7px 12px;border-radius:99px}
nav.tabs a:hover{color:var(--ink);background:var(--bg)}
nav.tabs a.on{background:var(--garnet-soft);color:var(--garnet);font-weight:600}
nav.tabs a:focus-visible{outline:2px solid var(--garnet)}

main{padding-block:26px 56px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,4.5vw,36px);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--garnet)}
h2{font-family:var(--display);font-weight:700;font-size:18px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.pagehead{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px;margin-bottom:20px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.note{font-size:13px;color:var(--muted);margin:0 0 12px}

input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--garnet);outline-offset:1px}
input[type=number]{font-variant-numeric:tabular-nums;text-align:right}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;font-weight:500}
button:hover{border-color:var(--muted)}
button.primary{background:var(--garnet);border-color:var(--garnet);color:var(--surface)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--garnet)}
button.danger{color:var(--garnet)}

.tablewrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%}
table.edit{min-width:700px}
table.edit.short{min-width:360px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
th.num,td.num{text-align:right}
td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
td.cost{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;padding-right:8px}
tfoot td{border-bottom:none;padding-top:10px;font-weight:600}
.w-name{width:30%}.w-n{width:12%}.w-u{width:11%}.w-c{width:12%}

.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.toggle input{width:auto;accent-color:var(--garnet);transform:scale(1.25)}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.hint b{color:var(--ink);font-variant-numeric:tabular-nums}

/* Item picker */
.picker{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.picker button.item{border-radius:99px;padding:6px 14px}
.picker button.item.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.exnote{font-size:12px;background:var(--garnet-soft);color:var(--garnet);padding:3px 10px;border-radius:99px;font-weight:600;margin:0}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}

/* Results */
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:920px){aside{position:static}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.hero{background:var(--garnet);border-color:var(--garnet);color:var(--surface)}
.card.hero .label{color:var(--surface);opacity:.8}
.big{font-family:var(--display);font-weight:700;font-size:42px;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.mid{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.row span:last-child{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.hero .row{border-top:1px solid color-mix(in srgb,var(--surface) 25%,transparent);padding-top:6px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--pist-soft);color:var(--pistachio)}
.chip.off{background:var(--garnet-soft);color:var(--garnet)}
.bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--line);margin-top:12px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}

/* Overview */
.ov{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:820px){.ov{grid-template-columns:minmax(0,1fr)}}
.ov .wide{grid-column:1/-1}
.ov table td,.ov table th{padding:8px 6px}
.ov td.num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.ov a.open{font-size:13px;color:var(--garnet);font-weight:600;text-decoration:none}
.ov a.open:hover{text-decoration:underline}
.cakeline{display:flex;flex-wrap:wrap;gap:28px;align-items:end}
.copied{font-size:13px;color:var(--pistachio);font-weight:600}
textarea.fallback{width:100%;min-height:160px;font:13px/1.5 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:10px}
.saved{font-size:12px;color:var(--muted)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
.logo-mark{flex:none;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px var(--line)}
.inv-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px;align-items:start}
@media (max-width:1020px){.inv-grid{grid-template-columns:minmax(0,1fr)}}
.preview-wrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);min-width:0}
@media (max-width:1020px){.preview-wrap{position:static}}
.preview-scroll{overflow-x:auto;border-radius:12px}
.preview-scroll .paper{zoom:var(--z,1)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
table.edit.lines{min-width:520px}
.lines .w-q{width:76px}.lines .w-p{width:112px}.lines .w-t{width:100px}
details.biz summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:18px}
details.biz[open] summary{margin-bottom:12px}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-height:72px;resize:vertical}
textarea:focus{outline:2px solid var(--garnet);outline-offset:1px}
.addsel{max-width:360px}
.msg{font-size:13px;color:var(--muted)}
/* Invoice paper: a printed document, deliberately always light */
.paper{--p-ink:#2A1A20;--p-muted:#7A6670;--p-line:#E7DCE1;--p-garnet:#9E1B3B;--p-soft:#FBF0F2;--p-gold:#A8823A;
  background:#FFFFFF;color:var(--p-ink);width:760px;max-width:none;padding:44px 48px;font-family:var(--body);font-size:13px;line-height:1.5;border:1px solid var(--line);border-radius:12px}
.paper .p-top{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.paper .p-brand{display:flex;gap:14px;align-items:center}
.paper .p-brand img{width:96px;height:96px;border-radius:50%;object-fit:cover;box-shadow:none}
.paper .p-name{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;color:var(--p-garnet)}
.paper .p-tag{font-size:11px;color:var(--p-gold);letter-spacing:.06em;text-transform:uppercase;max-width:30ch}
.paper .p-contact{margin-top:14px;color:var(--p-muted);font-size:12px;white-space:pre-line}
.paper .p-title{font-family:var(--display);font-weight:700;font-size:34px;color:var(--p-garnet);letter-spacing:.06em;text-align:right;line-height:1}
.paper .p-meta{margin-top:12px;display:grid;grid-template-columns:auto auto;gap:2px 14px;justify-content:end;font-size:12px}
.paper .p-meta span:nth-child(odd){color:var(--p-muted);text-align:right}
.paper .p-meta span:nth-child(even){font-weight:600;font-variant-numeric:tabular-nums}
.paper .p-parties{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin:28px 0 22px;padding:16px 18px;background:var(--p-soft);border-radius:10px}
.paper .p-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--p-muted);font-weight:600;margin-bottom:4px}
.paper .p-parties div div,.paper .p-notes div div{white-space:pre-line}
.paper table{width:100%;border-collapse:collapse}
.paper th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--p-muted);border-bottom:1.5px solid var(--p-ink);padding:8px 6px;text-align:left}
.paper td{padding:10px 6px;border-bottom:1px solid var(--p-line);color:var(--p-ink)}
.paper tr{page-break-inside:avoid}
.paper .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.paper .p-totals{margin-left:auto;width:290px;margin-top:16px;display:flex;flex-direction:column;gap:6px}
.paper .p-totals div{display:flex;justify-content:space-between;gap:12px}
.paper .p-totals span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.paper .p-grand{border-top:1.5px solid var(--p-ink);padding-top:8px;font-size:15px}
.paper .p-due{background:var(--p-garnet);color:#FFFFFF;padding:10px 12px;border-radius:8px;font-size:15px}
.paper .p-notes{margin-top:28px;display:grid;grid-template-columns:1fr 1fr;gap:24px;font-size:12px}
.paper .p-foot{margin-top:34px;padding-top:14px;border-top:1px solid var(--p-line);text-align:center;color:var(--p-gold);font-size:12px;letter-spacing:.04em}
.paper .p-empty{color:var(--p-muted);text-align:center;padding:18px}
@media print{
  @page{size:letter;margin:0.4in}
  body{background:#FFFFFF}
  body::before,.topbar,.no-print{display:none!important}
  main{padding:0!important}
  .inv-grid{display:block}
  .preview-wrap{position:static}
  .preview-scroll{overflow:visible}
  .paper{border:0;border-radius:0;padding:0;width:auto;zoom:1!important}
}
</style>

/* ---------- calculations ---------- */
function matCost(g){const s=num(g.size);return s>0?num(g.price)/s*num(g.used):0}
function bakeCalc(it){
  const rows=it.ingredients.map(matCost), ing=sum(rows);
  const cnt=Math.max(1,num(it.rentCount));
  const rentTotal=it.rentMode==="hour"?num(it.rentRate)*num(it.rentHours):num(it.rentRate);
  const rentEach=rentTotal/cnt, rent=it.rentOn?rentEach:0;
  const pack=num(it.pack),labor=num(it.labor),other=num(it.other);
  const cost=ing+pack+labor+other+rent;
  const price=roundUp(cost*(1+num(it.markup)/100));
  const portions=Math.max(1,Math.round(num(it.portions)));
  const pCost=cost/portions, pPrice=roundUp(pCost*(1+num(it.portionMarkup)/100));
  return {rows,ing,rentEach,rent,pack,labor,other,cost,price,profit:price-cost,portions,pCost,pPrice,pProfit:pPrice-pCost,
    asPieces:pPrice*portions,asPiecesProfit:pPrice*portions-cost,
    parts:[["Ingredients",ing,"var(--garnet)"],["Packaging",pack,"var(--pistachio)"],["Labor",labor,"var(--muted)"],["Other",other,"var(--ink)"],["Kitchen rent",rent,"var(--amber)"]]};
}
function decorCalc(it){
  const rows=it.materials.map(matCost), mat=sum(rows);
  const ext=sum(it.extras.map(x=>num(x.amount)));
  const labor=num(it.hours)*Math.max(1,num(it.people))*num(it.rate);
  const delivery=num(it.delivery);
  const cost=mat+ext+labor+delivery;
  const price=roundUp(cost*(1+num(it.markup)/100));
  const deposit=Math.round(price*num(it.deposit))/100;
  return {rows,mat,ext,labor,delivery,cost,price,profit:price-cost,deposit,balance:price-deposit,
    parts:[["Materials",mat,"var(--garnet)"],["Equipment & other",ext,"var(--amber)"],["Labor",labor,"var(--pistachio)"],["Delivery & setup travel",delivery,"var(--muted)"]]};
}

function priceListText(){
  const c=bakeCalc(S.cake);const L=["Anar Bloom price list","",`Anar Bloom cake: ${money(c.price)} whole, ${money(c.pPrice)} per slice`,"","Desserts"];
  S.desserts.forEach(d=>{const x=bakeCalc(d);L.push(`- ${d.name}: ${money(x.price)} per ${d.whole}, ${money(x.pPrice)} per ${d.piece}`)});
  L.push("","Balloon decoration");S.balloons.forEach(d=>L.push(`- ${d.name}: ${money(decorCalc(d).price)}`));
  L.push("","Party decoration");S.party.forEach(d=>L.push(`- ${d.name}: ${money(decorCalc(d).price)}`));
  return L.join("\n");
}

/* ---------- render & update ---------- */
function render(){
  const r=route();
  $("tabs").innerHTML=ROUTES.map(([id,t])=>`<a href="#${id}" class="${id===r?"on":""}"${id===r?' aria-current="page"':""}>${t}</a>`).join("");
  const it=item(r);
  $("brandmark").innerHTML=LOGO(36);
  $("app").innerHTML=r==="overview"?overviewPage():r==="invoices"?invoicePage():(LISTS[r]&&LISTS[r].kind==="decor")?decorPage(r,it):bakePage(r,it);
  calc();
}
function fillBar(parts,cost){
  const p=parts.filter(x=>x[1]>0);
  $("r-bar").innerHTML=p.map(x=>`<i style="width:${cost?x[1]/cost*100:0}%;background:${x[2]}"></i>`).join("");
  $("r-legend").innerHTML=p.map(x=>`<span style="--c:${x[2]}">${x[0]} ${cost?Math.round(x[1]/cost*100):0}%</span>`).join("")||"<span>No costs yet</span>";
}
function calc(){
  const r=route(),it=item(r);
  if(r==="overview"){$("ov").innerHTML=overviewTables();save();return}
  if(r==="invoices"){if(S.invoices.length)invCalc();save();return}
  const decor=LISTS[r]&&LISTS[r].kind==="decor";
  if(decor){
    const c=decorCalc(it);
    c.rows.forEach((v,i)=>setT("rc-"+i,money(v)));
    setT("r-mat",money(c.mat));setT("r-ext",money(c.ext));setT("r-labor",money(c.labor));
    setT("r-price",money(c.price));setT("r-cost",money(c.cost));setT("r-profit",money(c.profit));
    setT("r-deposit",money(c.deposit)+" deposit");setT("r-deposit2",money(c.deposit));setT("r-balance",money(c.balance));
    fillBar(c.parts,c.cost);
  }else{
    const c=bakeCalc(it),w=it.whole||"item",p=it.piece||"piece";
    document.querySelectorAll("[data-w]").forEach(e=>e.textContent=w);
    document.querySelectorAll("[data-p]").forEach(e=>e.textContent=p);
    setT("l-markup",`Whole ${w} markup on cost (%)`);setT("l-portions",`${p[0].toUpperCase()+p.slice(1)}s per ${w}`);setT("l-pmarkup",`Per-${p} markup on cost (%)`);
    c.rows.forEach((v,i)=>setT("rc-"+i,money(v)));setT("r-mat",money(c.ing));
    const m=it.rentMode;
    $("hoursWrap").hidden=m!=="hour";
    setT("l-rate",m==="hour"?"Rent per hour":m==="day"?"Rent per day / shift":"Rent per month");
    setT("l-count",`${w[0].toUpperCase()+w.slice(1)}s made per ${m==="month"?"month":m==="day"?"day":"session"}`);
    setT("r-renteach",money(c.rentEach));
    $("r-rentbody").style.opacity=it.rentOn?1:.45;
    const chip=$("r-rentchip");chip.textContent=it.rentOn?"On":"Off";chip.className="chip"+(it.rentOn?"":" off");
    setT("r-price",money(c.price));setT("r-cost",money(c.cost));setT("r-profit",money(c.profit));
    setT("r-pprice",money(c.pPrice));setT("r-pcost",money(c.pCost));setT("r-pprofit",money(c.pProfit));
    setT("r-aspieces",money(c.asPieces));setT("r-aspiecesprofit",money(c.asPiecesProfit));
    fillBar(c.parts,c.cost);
  }
  save();
}

const app=$("app");
app.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="restoretext"){restoreText=el.value;return}
  if(el.dataset.v){const inv=curInv();setPath(inv,el.dataset.v,el.value);if(inv.ex){inv.ex=false;const n=$("exnote");if(n)n.hidden=true}invCalc();save();return}
  if(el.dataset.biz){S.biz[el.dataset.biz]=el.value;invCalc();save();return}
  if(el.dataset.g){S[el.dataset.g]=el.value;calc();return}
  const p=el.dataset.b;if(!p)return;
  const it=item();
  setPath(it,p,el.type==="checkbox"?el.checked:el.value);
  if(it.ex){it.ex=false;const n=$("exnote");if(n)n.hidden=true}
  if(p==="name"){const L=LISTS[route()];const ch=$("chip-"+S[L.sel]);if(ch)ch.textContent=el.value||"Untitled"}
  calc();
});
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act,r=route(),it=item(r),L=LISTS[r];
  if(a==="toinvoice"){newInvoice([{desc:it.name,qty:1,price:decorCalc(it).price}]);location.hash="invoices";return}
  if(a==="invsel"){S.invSel=+b.dataset.i;pending=null;render();return}
  if(a==="invnew"){newInvoice([]);pending=null;render();return}
  if(a==="invdup"){const c=structuredClone(curInv());c.number=(S.biz.prefix||"")+(S.nextInv++);c.date=today();c.status="unpaid";c.paid=0;c.ex=false;S.invoices.push(c);S.invSel=S.invoices.length-1;render();return}
  if(a==="invdel"){pending="invdel";render();return}
  if(a==="invdelyes"){S.invoices.splice(S.invSel,1);S.invSel=Math.max(0,S.invSel-1);pending=null;render();return}
  if(a==="addline"){const inv=curInv();inv.lines.push({desc:"",qty:1,price:0});render();const d=document.querySelector(`[data-v="lines.${inv.lines.length-1}.desc"]`);d&&d.focus();return}
  if(a==="delline"){curInv().lines.splice(+b.dataset.i,1);render();return}
  if(a==="pdf"){downloadPdf();return}
  if(a==="print"){window.print();return}
  if(a==="bkdownload"){
    try{const blob=new Blob([JSON.stringify(S)],{type:"application/json"}),u=URL.createObjectURL(blob),x=document.createElement("a");
      x.href=u;x.download=`anar-bloom-backup-${today()}.json`;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);setT("bkmsg","Backup file saved")}
    catch(err){setT("bkmsg","Couldn't save a file here. Use Copy backup text.")}
    return}
  if(a==="bkcopy"){
    const txt=JSON.stringify(S),fb=()=>{restoreText=txt;const t=$("restoretext");t.value=txt;t.focus();t.select();setT("bkmsg","Select the text below and copy it")};
    try{navigator.clipboard.writeText(txt).then(()=>setT("bkmsg","Copied. Paste it somewhere safe, like a note or email to yourself."),fb)}catch(err){fb()}
    return}
  if(a==="restore"){
    let d;try{d=JSON.parse(restoreText)}catch(err){setT("restoremsg","That isn't a complete backup. Paste all of the backup text.");return}
    if(!d||d.v!==2||!Array.isArray(d.desserts)){setT("restoremsg","This isn't an Anar Bloom backup.");return}
    pending="restore";render();return}
  if(a==="restoreyes"){S=JSON.parse(restoreText);ensure();restoreText="";pending=null;render();setT("bkmsg","Restored");return}
  if(a==="addrow"){it[b.dataset.k].push(ing("",1000,"g",0,0));it.ex=false;render();const last=document.querySelector(`[data-b="${b.dataset.k}.${it[b.dataset.k].length-1}.name"]`);last&&last.focus();return}
  if(a==="delrow"){it[b.dataset.k].splice(+b.dataset.i,1);it.ex=false;render();return}
  if(a==="addextra"){it.extras.push({label:"",amount:0});it.ex=false;render();const l=document.querySelector(`[data-b="extras.${it.extras.length-1}.label"]`);l&&l.focus();return}
  if(a==="delextra"){it.extras.splice(+b.dataset.i,1);it.ex=false;render();return}
  if(a==="selitem"){S[L.sel]=+b.dataset.i;pending=null;render();return}
  if(a==="additem"){
    const n=L.kind==="bake"
      ?{ex:false,name:"New dessert",whole:"batch",piece:"piece",ingredients:[ing("",1000,"g",0,0)],pack:0,labor:0,other:0,...rent,rentOn:false,rentCount:5,markup:100,portions:12,portionMarkup:100}
      :{ex:false,name:"New "+L.noun,materials:[ing("",100,"pcs",0,0)],extras:[],hours:1,people:1,rate:25,delivery:0,markup:80,deposit:50};
    S[L.key].push(n);S[L.sel]=S[L.key].length-1;pending=null;render();
    const nm=document.querySelector('[data-b="name"]');if(nm){nm.focus();nm.select()}return}
  if(a==="delitem"){pending="delitem";render();return}
  if(a==="delyes"){S[L.key].splice(S[L.sel],1);S[L.sel]=0;pending=null;render();return}
  if(a==="delno"){pending=null;render();return}
  if(a==="reset"){pending="reset";render();return}
  if(a==="resetyes"){S=structuredClone(EXAMPLE);ensure();pending=null;render();return}
  if(a==="goitem"){S[LISTS[b.dataset.r].sel]=+b.dataset.i;return}
  if(a==="copy"){
    const txt=priceListText(),done=()=>{setT("copied","Copied");setTimeout(()=>setT("copied",""),2500)};
    const fb=()=>{const t=$("fallback");t.value=txt;t.hidden=false;t.focus();t.select();setT("copied","Select all and copy")};
    try{navigator.clipboard.writeText(txt).then(done,fb)}catch(err){fb()}
  }
});

const ORDER_EX={ex:true,name:"Two-tier birthday cake + 12 cupcakes",
  materials:[ing("Gold Medal all-purpose flour",2268,"g",3.99,900),ing("Domino granulated sugar",1814,"g",4.29,700),ing("Large eggs",12,"pcs",3.99,12),ing("Land O Lakes unsalted butter",454,"g",5.49,450),ing("Heavy whipping cream",946,"ml",6.49,950),ing("Satin Ice white fondant",907,"g",16.99,600),ing("Cake board and box",1,"pcs",8.99,1),ing("Cupcake liners",75,"pcs",3.99,12),ing("Cupcake box (12)",1,"pcs",4.99,1)],
  extras:[{label:"Custom cake topper",amount:12}],hours:6,people:1,rate:20,delivery:15,markup:60,deposit:50};
const BIZ={name:"Anar Bloom",tagline:"Event planning & design",contact:"",
  payment:"Zelle, Venmo or cash.\nA deposit books your date. The balance is due on delivery.",notes:"Keep desserts refrigerated and enjoy within 5 days.",prefix:"AB-"};
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmtDate(iso){if(!iso)return "";const d=new Date(iso+"T00:00:00");return isNaN(d)?esc(iso):d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}
function curInv(){if(!S.invoices.length)return null;S.invSel=Math.min(Math.max(0,S.invSel|0),S.invoices.length-1);return S.invoices[S.invSel]}
function newInvoice(lines){
  const inv={number:(S.biz.prefix||"")+(S.nextInv++),date:today(),due:"",status:"unpaid",client:{name:"",phone:"",email:"",address:""},event:"",
    lines:lines||[],discountType:"amount",discount:0,delivery:0,tax:0,paid:0,notes:S.biz.notes||""};
  S.invoices.push(inv);S.invSel=S.invoices.length-1;return inv;
}
function catalog(){
  const out=[],c=bakeCalc(S.cake);
  out.push({g:"Anar Bloom cake",label:"Anar Bloom cake (whole)",price:c.price},{g:"Anar Bloom cake",label:"Anar Bloom cake (per slice)",price:c.pPrice});
  S.desserts.forEach(d=>{const x=bakeCalc(d);out.push({g:"Desserts",label:`${d.name} (${d.whole})`,price:x.price},{g:"Desserts",label:`${d.name} (per ${d.piece})`,price:x.pPrice})});
  [["balloons","Balloon decoration"],["party","Party decoration"],["orders","Custom orders"]].forEach(([k,g])=>S[k].forEach(d=>out.push({g,label:d.name,price:decorCalc(d).price})));
  return out;
}
function invTotals(inv){
  const sub=sum(inv.lines.map(l=>num(l.qty)*num(l.price)));
  const disc=Math.min(sub,inv.discountType==="percent"?sub*num(inv.discount)/100:num(inv.discount));
  const tax=(sub-disc)*num(inv.tax)/100,delivery=num(inv.delivery),total=sub-disc+tax+delivery,paid=num(inv.paid);
  return {sub,disc,tax,delivery,total,paid,balance:total-paid};
}
const chipLabel=x=>x.number+(x.client&&x.client.name?" · "+x.client.name:"")+(x.status==="paid"?" ✓":"");
function ensure(){
  if(!S.biz)S.biz=structuredClone(BIZ);
  if(!Array.isArray(S.orders)){S.orders=[structuredClone(ORDER_EX)];S.oSel=0}
  if(!S.nextInv)S.nextInv=1001;
  if(!Array.isArray(S.invoices)){
    S.invoices=[];S.invSel=0;
    const c=catalog();
    const lines=[["Anar Bloom cake (whole)",1],["Baklava (per piece)",24],["Organic garland 3 m",1]].map(([l,q])=>{const x=c.find(y=>y.label===l);return x&&{desc:x.label,qty:q,price:x.price}}).filter(Boolean);
    const inv=newInvoice(lines);inv.ex=true;inv.client.name="Example client";inv.event="Birthday party, delivery and setup";
    inv.paid=Math.round(invTotals(inv).total/2*100)/100;inv.status="deposit";
  }
}

      <div class="fields">${V("Invoice number","number",inv.number)}${VS("Status","status",inv.status,[["unpaid","Unpaid"],["deposit","Deposit paid"],["paid","Paid in full"]])}${V("Invoice date","date",inv.date,"date")}${V("Due date","due",inv.due,"date")}</div>

      ${t.tax?`<div><span>Sales tax (${num(inv.tax)}%)</span><span>${money(t.tax)}</span></div>`:""}
      ${t.delivery?`<div><span>Delivery</span><span>${money(t.delivery)}</span></div>`:""}
      <div class="p-grand"><span>Total</span><span>${money(t.total)}</span></div>
      ${t.paid?`<div><span>Paid</span><span>−${money(t.paid)}</span></div>`:""}
      <div class="p-due"><span>Balance due</span><span>${money(t.balance)}</span></div></div>
    ${(b.payment||inv.notes)?`<div class="p-notes"><div>${b.payment?`<div class="p-lbl">How to pay</div><div>${esc(b.payment)}</div>`:""}</div><div>${inv.notes?`<div class="p-lbl">Notes</div><div>${esc(inv.notes)}</div>`:""}</div></div>`:""}
    <div class="p-foot">Thank you for choosing ${esc(b.name||"Anar Bloom")}</div>`;
}
function invCalc(){
  const inv=curInv();if(!inv)return;
  inv.lines.forEach((l,i)=>setT("lt-"+i,money(num(l.qty)*num(l.price))));
  const p=$("paper");if(p){p.innerHTML=paperHTML(inv);fitPaper()}
  setT("ichip-"+S.invSel,chipLabel(inv));
}
function fitPaper(){const w=document.querySelector(".preview-scroll");if(w)w.style.setProperty("--z",Math.min(1,w.parentElement.clientWidth/760).toFixed(3))}
window.addEventListener("resize",()=>{if(route()==="invoices")fitPaper()});
function downloadPdf(){
  const inv=curInv();if(!inv)return;
  if(!window.html2pdf){setT("pdfmsg","The PDF tool didn't load. Use Print and choose Save as PDF.");return}
  const box=document.createElement("div");box.style.cssText="position:fixed;left:-10000px;top:0";
  const clone=$("paper").cloneNode(true);clone.removeAttribute("id");clone.style.border="0";clone.style.borderRadius="0";
  box.appendChild(clone);document.body.appendChild(box);setT("pdfmsg","Making the PDF…");
  const name=`${inv.number} ${inv.client.name||""}`.trim().replace(/[^\w\- ]+/g,"")||"invoice";
  html2pdf().set({margin:[0.3,0.3,0.3,0.3],filename:name+".pdf",image:{type:"jpeg",quality:0.96},html2canvas:{scale:2,backgroundColor:"#FFFFFF"},jsPDF:{unit:"in",format:"letter",orientation:"portrait"},pagebreak:{mode:["css"]}})
    .from(clone).save().then(()=>{box.remove();setT("pdfmsg","PDF saved to your downloads")})
    .catch(()=>{box.remove();setT("pdfmsg","Couldn't make the PDF. Use Print and choose Save as PDF.")});
}
app.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="addfrom"&&el.value!==""){const c=catalog()[+el.value];curInv().lines.push({desc:c.label,qty:1,price:c.price});render();return}
  if(el.id==="restorefile"&&el.files&&el.files[0]){const rd=new FileReader();rd.onload=()=>{restoreText=String(rd.result);$("restoretext").value=restoreText;setT("restoremsg","Backup loaded. Press Restore from backup.")};rd.readAsText(el.files[0])}
});
app.addEventListener("toggle",e=>{if(e.target.matches&&e.target.matches("details.biz"))S.bizOpen=e.target.open},true);

ensure();
render();
})();
</script>

</html>
